# ============================================================
# Mango WM - Window Rules
# ============================================================
# Format: windowrule=Parameter:Values,appid/title:Pattern
# Supports regex for appid and title matching.

# ---- Floating Windows ----
windowrule=isfloating:1,appid:pavucontrol
windowrule=isfloating:1,appid:blueman-manager
windowrule=isfloating:1,appid:nm-connection-editor
windowrule=isfloating:1,appid:org.gnome.Calculator
windowrule=isfloating:1,appid:org.gnome.Loupe
windowrule=isfloating:1,appid:imv
windowrule=isfloating:1,appid:mpv
windowrule=isfloating:1,title:Picture-in-Picture
windowrule=isfloating:1,title:pinentry

# ---- Pinentry (center) ----
windowrule=isfloating:1,width:400,height:300,appid:pinentry-gtk-2

# ---- Firefox Picture-in-Picture ----
windowrule=isfloating:1,width:480,height:360,appid:firefox,title:Picture-in-Picture

# ---- Steam ----
windowrule=isfloating:1,appid:steam,title:^$
windowrule=isfloating:1,appid:steam,title:Steam Guard

# ---- Global Windows (sticky across tags) ----
windowrule=isglobal:1,appid:waybar
windowrule=isglobal:1,appid:otter-bar

# ---- Otter overlays (float above tiled layout) ----
windowrule=isfloating:1,appid:otter-launcher
windowrule=isfloating:1,appid:otter-logout
windowrule=isfloating:1,appid:otter-search
windowrule=isfloating:1,appid:otter-clip
windowrule=isfloating:1,appid:otter-notifications
windowrule=isfloating:1,appid:otter-wallpaper
windowrule=isfloating:1,appid:otter-transcribe
windowrule=isfloating:1,appid:otter-osd

# ---- Opacity ----
windowrule=focused_opacity:1.0,appid:foot
windowrule=unfocused_opacity:0.85,appid:foot

# ---- No Blur ----
windowrule=noblur:1,appid:slurp
windowrule=noblur:1,appid:grim
windowrule=noblur:1,appid:wlogout
windowrule=noblur:1,appid:rofi
windowrule=noblur:1,appid:otter-launcher
windowrule=noblur:1,appid:otter-logout
windowrule=noblur:1,appid:otter-osd
windowrule=noblur:1,appid:otter-search

# ---- No Shadow ----
windowrule=isnoshadow:1,appid:waybar
windowrule=isnoshadow:1,appid:slurp
windowrule=isnoshadow:1,appid:otter-bar
windowrule=isnoshadow:1,appid:otter-osd
windowrule=isnoshadow:1,appid:otter-launcher
windowrule=isnoshadow:1,appid:otter-logout

# ---- No Border ----
windowrule=isnoborder:1,appid:waybar
windowrule=isnoborder:1,appid:dms
windowrule=isnoborder:1,appid:otter-bar
windowrule=isnoborder:1,appid:otter-osd
windowrule=isnoborder:1,appid:otter-launcher
windowrule=isnoborder:1,appid:otter-logout
windowrule=isnoborder:1,appid:otter-notifications
windowrule=isnoborder:1,appid:otter-clip
windowrule=isnoborder:1,appid:otter-search
windowrule=isnoborder:1,appid:otter-wallpaper
windowrule=isnoborder:1,appid:otter-transcribe

# ---- No Radius ----
windowrule=isnoradius:1,appid:waybar
windowrule=isnoradius:1,appid:otter-bar

# ---- Tearing (Games) ----
# windowrule=force_tearing:1,title:vkcube
# windowrule=force_tearing:1,title:Counter-Strike 2

# ---- Terminal Swallowing ----
windowrule=isterm:1,appid:foot
windowrule=isterm:1,appid:alacritty
windowrule=isterm:1,appid:kitty
windowrule=isterm:1,appid:st

# ---- Layer Rules ----
layerrule=noblur:1,layer_name:selection
layerrule=noanim:0,noblur:1,layer_name:rofi

# Otter layer-shell surfaces (names may need tweaking after first run)
layerrule=noanim:0,noblur:0,layer_name:otter-bar
layerrule=noblur:1,noanim:1,layer_name:otter-osd
layerrule=noblur:1,layer_name:otter-notifications
layerrule=noblur:1,layer_name:otter-launcher
layerrule=noblur:1,layer_name:otter-logout
layerrule=noblur:1,layer_name:otter-search
layerrule=noblur:1,layer_name:otter-clip
layerrule=noblur:1,layer_name:otter-wallpaper
